<p-table
    #dt
    [value]="users"
    dataKey="userID"
    [rows]="15"
    [loading]="loading"
    [paginator]="true"
    responsiveLayout="scroll"
    [globalFilterFields]="['username','fullName','phone','email','role','companyName']">

    <ng-template pTemplate="caption">
        <div class="table-toolbar">
            <div class="toolbar-search">
                <button pButton class="p-button-outlined" icon="pi pi-filter-slash" (click)="clear(dt)"></button>
                <span class="p-input-icon-left">
                    <i class="pi pi-search"></i>
                    <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" placeholder="Buscar usuario" class="w-full" />
                </span>
            </div>

            <div class="toolbar-filters">
                <p-dropdown [options]="roleOptions" [(ngModel)]="selectedRole" optionLabel="label" optionValue="value" placeholder="Rol" (onChange)="onRoleChange()"></p-dropdown>
                <p-dropdown [options]="statusOptions" [(ngModel)]="selectedStatus" optionLabel="label" optionValue="value" placeholder="Estado" (onChange)="onStatusChange()"></p-dropdown>
                <button *ngIf="canManageUsers" pButton icon="pi pi-user-plus" class="p-button-outlined" (click)="goCreate()"></button>
            </div>
        </div>
    </ng-template>

    <ng-template pTemplate="header">
        <tr>
            <th>Usuario</th>
            <th>Nombre</th>
            <th>Rol</th>
            <th>Empresa</th>
            <th>Contacto</th>
            <th>Estado</th>
            <th>Cambio de clave</th>
        </tr>
    </ng-template>

    <ng-template pTemplate="body" let-user>
        <tr>
            <td>
                <a class="link" (click)="openCustomer(user)">{{ user.username }}</a>
            </td>
            <td>{{ user.fullName }}</td>
            <td>
                <span class="portal-tag">{{ user.role }}</span>
            </td>
            <td>{{ user.companyName }}</td>
            <td>
                <div>{{ user.phone }}</div>
                <small class="muted">{{ user.email }}</small>
            </td>
            <td>
                <span class="badge" [ngClass]="user.isActive ? 'active' : 'inactive'">
                    {{ user.isActive ? 'Activo' : 'Inactivo' }}
                </span>
            </td>
            <td>
                <span class="badge" [ngClass]="user.mustChangePassword ? 'inactive' : 'active'">
                    {{ user.mustChangePassword ? 'Pendiente' : 'Al dia' }}
                </span>
            </td>
        </tr>
    </ng-template>
</p-table>
