<p-toast></p-toast>

<div class="card portal-card">
    <div class="portal-card-header">
        <div>
            <span class="section-kicker">Alta interna</span>
            <h4>Registrar usuario del portal</h4>
            <p>Los usuarios internos se crean con contrasena temporal <strong>123456</strong>.</p>
        </div>
        <button pButton icon="pi pi-arrow-left" class="p-button-text" (click)="goBack()"></button>
    </div>

    <form [formGroup]="form" class="grid mt-3">
        <div class="col-12 md:col-6 field-block">
            <label>Usuario</label>
            <input pInputText formControlName="username" class="w-full" />
        </div>

        <div class="col-12 md:col-6 field-block">
            <label>Rol</label>
            <p-dropdown [options]="roleOptions" formControlName="roleName" optionLabel="label" optionValue="value" class="w-full"></p-dropdown>
        </div>

        <div class="col-12 md:col-6 field-block">
            <label>Nombre</label>
            <input pInputText formControlName="firstName" class="w-full" />
        </div>

        <div class="col-12 md:col-6 field-block">
            <label>Apellido</label>
            <input pInputText formControlName="lastName" class="w-full" />
        </div>

        <div class="col-12 md:col-6 field-block">
            <label>Telefono</label>
            <input pInputText formControlName="phone" class="w-full" />
        </div>

        <div class="col-12 md:col-6 field-block">
            <label>Email</label>
            <input pInputText formControlName="email" class="w-full" />
        </div>

        <div class="col-12 field-block" *ngIf="isSuperAdmin">
            <label>Compania destino</label>
            <p-dropdown [options]="companies" formControlName="companyId" optionLabel="companyName" optionValue="companyID" placeholder="Selecciona una compania" class="w-full"></p-dropdown>
        </div>
    </form>

    <div class="portal-card-actions">
        <button pButton label="Registrar usuario" icon="pi pi-user-plus" (click)="submit()" [loading]="loading"></button>
    </div>
</div>
