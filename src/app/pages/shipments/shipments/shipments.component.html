<p-table 
    #dt1 [value]="shipments"
    dataKey="shipmentNo"
    [rows]="25"
    [loading]="loading"
    [paginator]="true"
    responsiveLayout="scroll"
	[globalFilterFields]="['shipmentNo','companyCode','shipmentStatus','customerName']">

	<ng-template pTemplate="caption">
					<div class="flex justify-content-between flex-column sm:flex-row">
						<button pButton label="Clear" class="p-button-outlined mb-2" icon="pi pi-filter-slash" (click)="clear(dt1)"></button>
						<span class="p-input-icon-left mb-2">
							<i class="pi pi-search"></i>
							<input pInputText type="text" #filter (input)="onGlobalFilter(dt1, $event)" placeholder="Search Keyword" class="w-full"/>
						</span>
						 

                        <button  
                            pButton    
                            icon="pi pi-plus"    
                            class="p-button-outlined"   
                            pTooltip="Create Shipment"  
                            tooltipPosition="left"   
                            routerLink="create">     
                        </button>

					</div>
				</ng-template>

    <ng-template pTemplate="header">
        <tr>
            <th pSortableColumn="shipmentNO">
                Shipment No                
				
            </th>

            <th pSortableColumn="companyname">
                Company
                
            </th>

            <th pSortableColumn="status">
                Status
                
            </th>

			<th pSortableColumn="customer_name">
                Customer Name
                
            </th>

        </tr>
    </ng-template>

    <ng-template pTemplate="body" let-s>
        <tr>
            <td>{{ s.shipmentNo }}</td>
            <td>{{ s.companyCode }}</td>
            <td>
                <span class="customer-badge status-{{s.status?.toLowerCase()}}">
                    {{ s.shipmentStatus }}
                </span>
            </td>
			<td>{{ s.customerName}}</td>

        </tr>
    </ng-template>

</p-table>
