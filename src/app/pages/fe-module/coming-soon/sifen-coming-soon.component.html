<section class="sifen-coming">
    <article class="sifen-coming__card">
        <div class="sifen-coming__icon">
            <i class="pi pi-wrench"></i>
        </div>

        <span class="sifen-coming__eyebrow">SIFEN</span>
        <h2>{{ title }}</h2>
        <p>Esta sección todavía no está habilitada en el entorno TEST. Puedes volver atrás y continuar navegando por el módulo SIFEN.</p>

        <div class="sifen-coming__actions">
            <button pButton type="button" icon="pi pi-arrow-left" class="p-button-rounded p-button-text sifen-icon-btn" pTooltip="Volver atras" tooltipPosition="top" aria-label="Volver atras" (click)="goBack()"></button>
            <button pButton type="button" icon="pi pi-home" class="p-button-rounded p-button-text sifen-icon-btn" pTooltip="Ir al inicio" tooltipPosition="top" aria-label="Ir al inicio" (click)="goToDashboard()"></button>
        </div>
    </article>
</section>
