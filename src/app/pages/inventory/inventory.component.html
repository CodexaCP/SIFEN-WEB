<p-table 
    
    #dt1
    [value]="movements"
    [rows]="20"
    [paginator]="true"
    [lazy]="true"
    [totalRecords]="totalRecords"
    (onLazyLoad)="loadItemsLazy($event)"
    [loading]="loading"
    responsiveLayout="scroll"
	[globalFilterFields]="['itemNo','description','uom','itemType']">

	<ng-template pTemplate="caption">
<div class="flex align-items-center justify-content-between">

    <!-- LEFT -->
    <div class="flex align-items-center gap-2">

        <button
            pButton
            icon="pi pi-filter-slash"
            class="p-button-outlined"
            (click)="clear(dt1)"
            pTooltip="Clear Filters"
            tooltipPosition="top">
        </button>

    </div>

    <!-- CENTER -->
    <div>

        <span class="p-input-icon-left">
            <i class="pi pi-search"></i>

            <input
                pInputText
                type="text"
                #filter
                (input)="onGlobalFilter($event)"
                placeholder="Search items"
                style="width:200px">
        </span>

    </div>

    <!-- RIGHT -->
    <div class="flex align-items-center gap-2">        

        <button 
            pButton
            icon="pi pi-arrow-down"
            class="p-button-outlined"
            pTooltip="Export Movements"
            tooltipPosition="left"
            (click)="exportMovemnets()">
        </button>

        <button
            pButton
            icon="pi pi-arrow-up"
            class="p-button-outlined"
            pTooltip="Import Movements"
            tooltipPosition="left"
            (click)="fileInput.click()">
        </button>

        <input
            type="file"
            #fileInput
            accept=".xlsx"
            style="display:none"
            (change)="importMovemnets($event)"/>

        <!-- button   pButton    icon="pi pi-plus"    class="p-button-outlined"   pTooltip="Create Item"   tooltipPosition="top"   routerLink="create">     </button>-->

    </div>

</div>

</ng-template>

    <ng-template pTemplate="header">
        <tr>
            <th pSortableColumn="itemNo">
                Item No                
				
            </th>

            <th pSortableColumn="itemDescription">
                Description
                
            </th>

            <th pSortableColumn="createdAt">
                Date
              
            </th>

            <th pSortableColumn="referenceNo">
                Type
                
            </th>

            

			<th pSortableColumn="itemType">
                Quantity
                
            </th>
            


        </tr>
    </ng-template>

    <ng-template pTemplate="body" let-s>
        <tr>
            <td>{{ s.itemNo }}</td>
            <td>{{ s.itemDescription }}</td>
            <td>{{ s.createdAt | date:'MM/dd/yyyy '}}</td>            
            <td>{{ s.referenceNo }} </td>
			<td>{{ s.quantity}}</td>
            
        </tr>
    </ng-template>

</p-table>
